<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Guess the number</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
</head>

<body>
    <button id="change_mode" onclick="ChangeTheme()">light mode</button>
    <div class="container">
        <h1>🎯 Guess the number Game</h1>
        <input type="text" id="playerName" placeholder="Enter your name">
        <div>
            <label>Select Difficulty</label>
            <button class="easy" onclick="playSound('click'), selectDifficulty('easy')">Easy</button>
            <button class="medium" onclick="playSound('click'), selectDifficulty('medium')">Medium</button>
            <button class="hard" onclick="playSound('click'), selectDifficulty('hard')">Hard</button>
        </div>
        <div>
            <button class="start" onclick="startGame()">Start Game</button>
        </div>
        <div>
            <button class="back" onclick="playAndNavigate('click', 'index.html')">Back to Menu</button>
        </div>
        <audio id="click" src="sounds/click.mp3"></audio>
    </div>
    <div id="message"></div>
    <script>
        let selectedDifficulty = '';

        function selectDifficulty(difficulty) {
            selectedDifficulty = difficulty;
            document.getElementById('message').textContent = `Difficulty: ${difficulty}`;
        }
        function goBack() {
            window.location.href = 'index.html';
        }
        function startGame() {
            let name = document.getElementById('playerName').value;

            if (name === '') {
                document.getElementById('message').textContent = '⚠️ Please enter your name!';
                return;
            }

            if (selectedDifficulty === '') {
                document.getElementById('message').textContent = '⚠️ Please select a difficulty!';
                return;
            }
            playSound('click');
            setTimeout(() => {
                window.location.href = `play.html?name=${name}&difficulty=${selectedDifficulty}`;
            }, 200);
        }
        function playSound(soundId) {
            let sound = document.getElementById(soundId);
            sound.currentTime = 0;
            sound.play();
        }
        function playAndNavigate(soundId, url) {
            playSound(soundId);
            setTimeout(() => {
                window.location.href = url;
            }, 200);
        }
        function ChangeTheme() {
            const isLight = document.body.classList.toggle('light-mode');
            const btn = document.getElementById('change_mode');
            if (isLight) {
                btn.textContent = 'dark mode';
                localStorage.setItem('theme', 'light');
            } else {
                btn.textContent = 'light mode';
                localStorage.setItem('theme', 'dark');
            }
        }
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            document.getElementById('change_mode').textContent = 'dark mode';
        }

    </script>
</body>

</html>
